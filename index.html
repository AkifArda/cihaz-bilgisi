<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>Cihaz Bilgisi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0e11;--card:#131a20;--line:#212b33;--tx:#d9e1e6;--mu:#7b8893;--ac:#1c9fae;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px}
header h1 b{color:var(--ac)}
header span{font:11px ui-monospace,Menlo,monospace;color:var(--mu)}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ac);margin-bottom:8px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row span{color:var(--mu);flex-shrink:0}
.row b{font:500 13px ui-monospace,Menlo,monospace;text-align:right;word-break:break-word}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile small{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.tile div{font:600 18px ui-monospace,Menlo,monospace;margin-top:4px;word-break:break-word}
.tile div.s{font-size:13px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .4s}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin:4px 0 10px}
.bar i{position:absolute;top:0;height:100%;background:var(--ac);border-radius:3px}
.bar:after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--mu)}
.ax{display:flex;justify-content:space-between;font:12px ui-monospace,Menlo,monospace}
.ax span{color:var(--mu)}
button.go{width:100%;background:var(--ac);color:#04161a;border:0;border-radius:12px;padding:12px;font-weight:600;font-size:14px;margin-bottom:12px}
.ok{color:var(--ac)}.no{color:var(--mu)}
#cmp{display:block;margin:4px auto 8px}
nav{display:flex;border-top:1px solid var(--line);background:#0e1317}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 8px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac)}
</style></head><body>
<header><h1>Cihaz<b>Bilgisi</b></h1><span id="clk"></span></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const NA="Desteklenmiyor";
const I={
ozet:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
donanim:'<rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
ekran:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
yazilim:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
ag:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8"/>',
sensor:'<path d="M3 12h4l3-8 4 16 3-8h4"/>'
};
const T=[["ozet","Özet"],["donanim","Donanım"],["ekran","Ekran"],["yazilim","Yazılım"],["ag","Ağ & Pil"],["sensor","Sensörler"]];
let tab="ozet",S={},bat=null,hi={},gpu={},sto=null,media={};
$("#nav").innerHTML=T.map(([k,l])=>`<button data-k="${k}"><svg viewBox="0 0 24 24">${I[k]}</svg>${l}</button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.k;draw()}};

/* veri toplama */
const ua=navigator.userAgent,ud=navigator.userAgentData,cn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
function osAd(){let m;
 if(hi.platform)return hi.platform+" "+(hi.platformVersion||"");
 if(m=ua.match(/Android ([\d.]+)/))return "Android "+m[1];
 if(m=ua.match(/(iPhone|CPU) OS ([\d_]+)/))return "iOS "+m[2].replace(/_/g,".");
 if(/Windows/.test(ua))return "Windows";
 if(/Mac OS X/.test(ua))return "macOS";
 if(/Linux/.test(ua))return "Linux";return "Bilinmiyor"}
function tarayici(){let m;
 if(m=ua.match(/(Edg|OPR|SamsungBrowser|Firefox|CriOS|FxiOS)\/([\d.]+)/))return ({Edg:"Edge",OPR:"Opera",CriOS:"Chrome",FxiOS:"Firefox"}[m[1]]||m[1])+" "+m[2];
 if(m=ua.match(/Chrome\/([\d.]+)/))return "Chrome "+m[1];
 if(m=ua.match(/Version\/([\d.]+).*Safari/))return "Safari "+m[1];return "Bilinmiyor"}
function glInfo(){try{const c=document.createElement("canvas"),g=c.getContext("webgl2")||c.getContext("webgl");if(!g)return;
 const e=g.getExtension("WEBGL_debug_renderer_info");
 gpu={v:e?g.getParameter(e.UNMASKED_VENDOR_WEBGL):g.getParameter(g.VENDOR),r:e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER),
 ver:g.getParameter(g.VERSION),tex:g.getParameter(g.MAX_TEXTURE_SIZE),gl2:!!c.getContext&&g instanceof WebGL2RenderingContext}}catch(e){}}
glInfo();
if(ud&&ud.getHighEntropyValues)ud.getHighEntropyValues(["platform","platformVersion","model","architecture","bitness"]).then(v=>{hi=v;draw()}).catch(()=>{});
if(navigator.getBattery)navigator.getBattery().then(b=>{bat=b;draw()});
function upSto(){if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(s=>{sto=s})}
upSto();
if(navigator.mediaDevices&&navigator.mediaDevices.enumerateDevices)navigator.mediaDevices.enumerateDevices().then(l=>{
 media={cam:l.filter(d=>d.kind==="videoinput").length,mic:l.filter(d=>d.kind==="audioinput").length,spk:l.filter(d=>d.kind==="audiooutput").length}}).catch(()=>{});

/* yardımcılar */
const R=(k,v)=>`<div class="row"><span>${k}</span><b>${v==null||v===""?"—":v}</b></div>`;
const C=(t,rows)=>`<div class="card"><h2>${t}</h2>${rows.map(r=>R(r[0],r[1])).join("")}</div>`;
const Ti=(k,v,s)=>`<div class="tile"><small>${k}</small><div class="${s?"s":""}">${v}</div></div>`;
const gb=b=>b==null?"—":(b/1073741824).toFixed(b>1e10?0:1)+" GB";
const yn=v=>v?'<span class="ok">Var</span>':'<span class="no">Yok</span>';
const pil=()=>bat?Math.round(bat.level*100):null;

/* sekmeler */
const V={
ozet(){const p=pil();return `<div class="grid">
${Ti("Platform",osAd(),1)}${Ti("Tarayıcı",tarayici(),1)}
${Ti("İşlemci",(navigator.hardwareConcurrency||"—")+" çekirdek")}${Ti("Bellek",navigator.deviceMemory?"~"+navigator.deviceMemory+" GB":"—")}
${Ti("Ekran",screen.width+"×"+screen.height)}${Ti("Pil",p==null?"—":"%"+p+(bat.charging?" ⚡":""))}</div>
${C("Grafik İşlemci",[["Üretici",gpu.v],["Model",gpu.r]])}
${C("Depolama (Uygulama Alanı)",[["Kullanılan",sto?gb(sto.usage):"—"],["Kota",sto?gb(sto.quota):"—"]])}
<div class="card"><h2>Hakkında</h2><div class="no" style="font-size:12px">Bu uygulama, tarayıcının cihaz hakkında paylaşmasına izin verdiği bilgileri gösterir. Bazı değerler (RAM, model, işlemci adı) gizlilik nedeniyle yaklaşık veya kısıtlı olabilir.</div></div>`},
donanim(){return C("İşlemci & Bellek",[["Mantıksal çekirdek",navigator.hardwareConcurrency],["Mimari",hi.architecture?hi.architecture+(hi.bitness?" / "+hi.bitness+" bit":""):null],["Bellek (yaklaşık)",navigator.deviceMemory?navigator.deviceMemory+" GB (üst sınır 8)":null],["Cihaz modeli",hi.model||null]])+
C("Grafik",[["Üretici",gpu.v],["Model",gpu.r],["WebGL sürümü",gpu.ver],["Maks. doku boyutu",gpu.tex?gpu.tex+" px":null],["WebGPU",yn(navigator.gpu)]])+
C("Giriş & Çevre Birimleri",[["Çoklu dokunma",navigator.maxTouchPoints+" nokta"],["Kamera",media.cam],["Mikrofon",media.mic],["Hoparlör / çıkış",media.spk],["Bluetooth",yn(navigator.bluetooth)],["USB",yn(navigator.usb)],["NFC",yn("NDEFReader"in window)],["Titreşim",yn(navigator.vibrate)]])+
C("Depolama",[["Kullanılan",sto?gb(sto.usage):null],["Toplam kota",sto?gb(sto.quota):null]])},
ekran(){const o=screen.orientation;return C("Panel",[["Çözünürlük",screen.width+" × "+screen.height],["Kullanılabilir alan",screen.availWidth+" × "+screen.availHeight],["Görünüm alanı",innerWidth+" × "+innerHeight],["Piksel oranı",devicePixelRatio+"x"],["Fiziksel piksel",Math.round(screen.width*devicePixelRatio)+" × "+Math.round(screen.height*devicePixelRatio)],["Yönelim",o?o.type:null],["Renk derinliği",screen.colorDepth+" bit"]])+
C("Görüntü Özellikleri",[["Geniş renk (P3)",yn(matchMedia("(color-gamut: p3)").matches)],["HDR",yn(matchMedia("(dynamic-range: high)").matches)],["Yüksek yenileme",yn(matchMedia("(min-resolution: 2dppx)").matches)],["Koyu mod tercihi",yn(matchMedia("(prefers-color-scheme: dark)").matches)],["Hareket azaltma",yn(matchMedia("(prefers-reduced-motion: reduce)").matches)],["Dokunmatik",yn(matchMedia("(pointer: coarse)").matches)]])},
yazilim(){return C("İşletim Sistemi",[["Sistem",osAd()],["Platform",navigator.platform],["Tarayıcı",tarayici()],["Motor",/Gecko\//.test(ua)&&!/like Gecko/.test(ua)?"Gecko":/AppleWebKit/.test(ua)?"WebKit / Blink":"—"]])+
C("Yerel Ayarlar",[["Dil",navigator.language],["Diller",(navigator.languages||[]).join(", ")],["Saat dilimi",Intl.DateTimeFormat().resolvedOptions().timeZone],["Yerel saat",new Date().toLocaleString("tr-TR")],["Çerezler",yn(navigator.cookieEnabled)],["Gizlilik sinyali (DNT)",navigator.doNotTrack]])+
C("Tarayıcı Yetenekleri",[["Service Worker",yn("serviceWorker"in navigator)],["WebAssembly",yn(window.WebAssembly)],["WebRTC",yn(window.RTCPeerConnection)],["Bildirimler",yn("Notification"in window)],["Panoya erişim",yn(navigator.clipboard)],["Paylaşım",yn(navigator.share)],["Konum",yn(navigator.geolocation)],["Ses tanıma",yn(window.SpeechRecognition||window.webkitSpeechRecognition)]])+
C("Ham Bilgi",[["User-Agent",`<span style="font-size:11px">${ua}</span>`]])},
ag(){const p=pil();return `<div class="card"><h2>Pil</h2>${bat?`<div class="tile" style="border:0;padding:0;background:none"><div style="font-size:30px">%${p} ${bat.charging?"⚡":""}</div></div><div class="meter"><i style="width:${p}%"></i></div>`+
R("Durum",bat.charging?"Şarj oluyor":"Şarj olmuyor")+R("Dolmaya kalan",bat.charging&&isFinite(bat.chargingTime)?Math.round(bat.chargingTime/60)+" dk":"—")+R("Boşalmaya kalan",!bat.charging&&isFinite(bat.dischargingTime)?Math.round(bat.dischargingTime/60)+" dk":"—"):R("Pil API","Bu tarayıcıda desteklenmiyor")}</div>`+
C("Bağlantı",[["Durum",navigator.onLine?'<span class="ok">Çevrimiçi</span>':"Çevrimdışı"],["Tür",cn?cn.type:null],["Etkin ağ türü",cn?cn.effectiveType:null],["İndirme hızı (tahmin)",cn&&cn.downlink?cn.downlink+" Mbps":null],["Gecikme (RTT)",cn&&cn.rtt!=null?cn.rtt+" ms":null],["Veri tasarrufu",cn?yn(cn.saveData):null]])},
sensor(){return `<button class="go" id="perm">Sensörleri Başlat</button>
<div class="card"><h2>Pusula</h2><canvas id="cmp" width="150" height="150"></canvas><div class="ax" style="justify-content:center;font-size:18px" id="hd">—</div></div>
<div class="card"><h2>İvmeölçer (m/s²)</h2>${["x","y","z"].map(a=>`<div class="ax"><span>${a.toUpperCase()}</span><b id="a${a}">—</b></div><div class="bar"><i id="ab${a}"></i></div>`).join("")}</div>
<div class="card"><h2>Jiroskop (°/s)</h2>${["alpha","beta","gamma"].map(a=>`<div class="ax"><span>${a}</span><b id="g${a}">—</b></div><div class="bar"><i id="gb${a}"></i></div>`).join("")}</div>
<div class="card"><h2>Yönelim (°)</h2>${R("Eğim ön-arka (beta)","<span id='ob'>—</span>")}${R("Eğim sağ-sol (gamma)","<span id='og'>—</span>")}</div>
<div class="card"><h2>Konum</h2><button class="go" id="geo" style="margin-bottom:8px">Konumu Al</button><div id="gp"></div></div>`}
};

function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));
 const m=$("#m"),y=m.scrollTop;m.innerHTML=V[tab]();m.scrollTop=y;
 if(tab==="sensor")bindSensor();
}
function setBar(id,v,max){const e=$("#"+id);if(!e)return;const w=Math.min(50,Math.abs(v)/max*50);e.style.width=w+"%";e.style.left=(v<0?50-w:50)+"%"}
function put(id,v,d){const e=$("#"+id);if(e)e.textContent=v==null?"—":v.toFixed(d==null?2:d)}
function needle(h){const c=$("#cmp");if(!c)return;const x=c.getContext("2d"),r=65;x.clearRect(0,0,150,150);x.translate(75,75);
 x.strokeStyle="#212b33";x.lineWidth=2;x.beginPath();x.arc(0,0,r,0,7);x.stroke();
 x.fillStyle="#7b8893";x.font="11px monospace";x.textAlign="center";x.textBaseline="middle";
 [["K",0],["D",90],["G",180],["B",270]].forEach(([t,a])=>{const rad=(a-h)*Math.PI/180;x.fillText(t,Math.sin(rad)*(r-12),-Math.cos(rad)*(r-12))});
 x.rotate(0);x.fillStyle="#1c9fae";x.beginPath();x.moveTo(0,-r+26);x.lineTo(7,0);x.lineTo(-7,0);x.fill();
 x.fillStyle="#3a444c";x.beginPath();x.moveTo(0,r-26);x.lineTo(7,0);x.lineTo(-7,0);x.fill();x.setTransform(1,0,0,1,0,0)}
function bindSensor(){
 const p=$("#perm");p.onclick=startSensors;needle(S.h||0);
 if(S.on){p.textContent="Sensörler Aktif";}
 $("#geo").onclick=()=>{if(!navigator.geolocation){$("#gp").innerHTML=R("Konum",NA);return}
  navigator.geolocation.getCurrentPosition(g=>{const c=g.coords;$("#gp").innerHTML=R("Enlem",c.latitude.toFixed(5))+R("Boylam",c.longitude.toFixed(5))+R("Doğruluk",Math.round(c.accuracy)+" m")+R("Rakım",c.altitude!=null?Math.round(c.altitude)+" m":null)+R("Hız",c.speed!=null?(c.speed*3.6).toFixed(1)+" km/s":null)},e=>{$("#gp").innerHTML=R("Hata","İzin verilmedi veya konum alınamadı")},{enableHighAccuracy:true,timeout:10000})}
}
async function startSensors(){
 try{for(const E of [window.DeviceMotionEvent,window.DeviceOrientationEvent]){if(E&&typeof E.requestPermission==="function"){const r=await E.requestPermission();if(r!=="granted")return}}}catch(e){return}
 if(S.on){draw();return}S.on=true;$("#perm").textContent="Sensörler Aktif";
 addEventListener("devicemotion",e=>{if(tab!=="sensor")return;const a=e.accelerationIncludingGravity,r=e.rotationRate;
  if(a){["x","y","z"].forEach(k=>{put("a"+k,a[k]);setBar("ab"+k,a[k]||0,20)})}
  if(r){["alpha","beta","gamma"].forEach(k=>{put("g"+k,r[k],1);setBar("gb"+k,r[k]||0,300)})}});
 const oh=e=>{if(tab!=="sensor")return;let h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?(360-e.alpha)%360:null);
  if(h!=null){S.h=h;needle(h);const d=["K","KD","D","GD","G","GB","B","KB"][Math.round(h/45)%8];$("#hd").textContent=Math.round(h)+"° "+d}
  put("ob",e.beta,1);put("og",e.gamma,1)};
 addEventListener("deviceorientationabsolute",oh);addEventListener("deviceorientation",oh);
}
setInterval(()=>{$("#clk").textContent=new Date().toLocaleTimeString("tr-TR");upSto();if(tab==="ag"||tab==="ozet")draw()},2000);
$("#clk").textContent=new Date().toLocaleTimeString("tr-TR");
addEventListener("resize",()=>{if(tab==="ekran")draw()});
draw();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
